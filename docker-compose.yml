version: '3.8'

services:
  app:
    build: .
    container_name: student_tracker_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://db:27017/student_tracker
      - JWT_SECRET=student_tracker_secure_access_token_secret_key_2026
      - JWT_REFRESH_SECRET=student_tracker_secure_refresh_token_secret_key_2026
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mongo:latest
    container_name: student_tracker_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mongo_data:
